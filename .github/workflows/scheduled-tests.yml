name: Scheduled Tally Automation Suite

on:
  schedule:
    # Runs automatically every day at 8:00 AM UTC (Cron Syntax)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub UI

jobs:
  run-selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run TestNG Tests via Maven
        run: mvn test -Dtest=FormSubmissionTest