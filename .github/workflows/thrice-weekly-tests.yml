name: Thrice Weekly Test Suite

on:
  schedule:
    - cron: '17 8 * * 1,3,5'
  workflow_dispatch:

jobs:
  run-suites:
    runs-on: ubuntu-latest
    env:
      TALLY_FORM_URL: ${{ secrets.TALLY_FORM_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run suites
        run: mvn -B test -DsuiteXmlFile=test-runner/tallyform-no-cv-link.xml,test-runner/tallyform-not-selected.xml,test-runner/tallyform-selected.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-thrice-weekly
          path: target/surefire-reports/
          retention-days: 30
